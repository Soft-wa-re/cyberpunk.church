<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">
  <defs>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="17" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.035"/>
      </feComponentTransfer>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="627" fill="#101413"/>
  <rect width="1200" height="627" fill="#ffffff" filter="url(#grain)" opacity="0.55"/>

  <!-- faint terminal frame -->
  <rect x="54" y="48" width="1092" height="531" rx="8" fill="none" stroke="#223028" stroke-width="2"/>
  <line x1="54" y1="166" x2="1146" y2="166" stroke="#7dbd36" stroke-width="1.5" stroke-dasharray="3 5" opacity="0.7"/>

  <!-- Header -->
  <text x="100" y="118"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace"
        font-size="48" font-weight="700" fill="#b6ff3b">./ Cyberpunk Church</text>

  <text x="100" y="151"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace"
        font-size="23" fill="#7d867e">Questions about intelligence, civilization, and reality.</text>

  <!-- Body / terminal prompt -->
  <text x="100" y="286"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace"
        font-size="26" fill="#59b7ff">Explore the full argument map →</text>

  <text x="100" y="380"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace"
        font-size="21" fill="#7d867e">passing obsessions, taken slightly too seriously.</text>

  <text x="100" y="446"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace"
        font-size="22" fill="#b6ff3b">&gt; follow the rabbit hole_</text>

  <!-- URL -->
  <text x="100" y="528"
        font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace"
        font-size="19" fill="#56625a">cyberpunk.church</text>
</svg>
