version: 1
id: where-is-everybody
title: Where Is Everybody?
description: The observations and assumptions that make the absence of an obvious extraterrestrial civilization surprising.

nodes:
  - id: central-question
    type: question
    title: Why has nobody made themselves obvious?
    body: The puzzle is not merely that we have failed to detect aliens. It is that no extraterrestrial civilization has left an unmistakable signal, artifact, probe, or work of engineering that we can confirm.
    epistemics:
      status: open
      belief:
        type: unknown
      cruxes:
        - Whether conspicuous technological civilizations should arise often enough for at least one to be visible by now.

  - id: observed-ambiguity
    type: claim
    title: Every possible civilization remains ambiguous
    body: As far as current observations show, every candidate extraterrestrial signal or artifact remains indistinguishable from natural phenomena or from no civilization at all.
    epistemics:
      status: accepted
      belief:
        type: qualitative
        value: Well supported
      confidence: high
    sources:
      - title: Technosignature
        url: https://en.wikipedia.org/wiki/Technosignature
        note: Overview of proposed observable signs of extraterrestrial technology.

  - id: no-local-trace
    type: evidence
    title: No confirmed local probe or artifact
    body: We have no confirmed extraterrestrial probe, artifact, or external technological presence in the Solar System.
    epistemics:
      status: accepted
      confidence: high
      cruxes:
        - Whether systematic searches of the Moon, asteroids, and other stable locations would reveal old artifacts.

  - id: no-remote-megastructure
    type: evidence
    title: No confirmed large-scale technosignature
    body: Searches have not confirmed artificial waste heat, a Dyson sphere, or a galaxy visibly transformed by technology.
    epistemics:
      status: accepted
      confidence: medium
    sources:
      - title: Dyson sphere
        url: https://en.wikipedia.org/wiki/Dyson_sphere
      - title: Kardashev scale
        url: https://en.wikipedia.org/wiki/Kardashev_scale

  - id: searches-are-limited
    type: objection
    title: Our searches cover very little of the possibility space
    body: SETI has sampled only a small fraction of relevant locations, frequencies, times, signal types, and possible forms of technology. Failure to detect something ordinary is therefore weak evidence of absence.
    epistemics:
      status: accepted
      belief:
        type: qualitative
        value: Strong objection
      confidence: high
    sources:
      - title: Search for extraterrestrial intelligence
        url: https://en.wikipedia.org/wiki/Search_for_extraterrestrial_intelligence

  - id: expansion-is-feasible
    type: assumption
    title: Sustained interstellar expansion is feasible
    body: At least one technological lineage could eventually build settlements or self-replicating machines able to cross interstellar distances and reproduce the expansion process.
    epistemics:
      status: tentative
      belief:
        type: qualitative
        value: Plausible
      confidence: low
      cruxes:
        - Whether autonomous interstellar self-replication is physically and practically achievable.
        - Whether expansion remains stable across millions of years and many generations.
    sources:
      - title: Self-replicating spacecraft
        url: https://en.wikipedia.org/wiki/Self-replicating_spacecraft

  - id: one-lineage-is-enough
    type: claim
    title: Only one persistent lineage is needed
    body: Even if most civilizations remain home, collapse, or lose interest, one durable expansionist lineage could eventually become difficult to miss.
    epistemics:
      status: tentative
      belief:
        type: qualitative
        value: Plausible if expansion is feasible
      confidence: medium
    sources:
      - title: Hart–Tipler conjecture
        url: https://en.wikipedia.org/wiki/Hart%E2%80%93Tipler_conjecture

  - id: optimistic-premises
    type: assumption
    title: The optimistic premises can all be moderately large
    body: Suitable worlds, life, intelligence, survival, expansion, conspicuous activity, and successful detection must each occur often enough for their combination to produce something visible.
    epistemics:
      status: open
      confidence: low
      cruxes:
        - Which step between a suitable planet and a conspicuous civilization is rarest.
    sources:
      - title: Drake equation
        url: https://en.wikipedia.org/wiki/Drake_equation

  - id: absence-is-surprising
    type: claim
    title: An untouched-looking galaxy is surprising
    body: If the optimistic premises hold and one lineage can spread, a galaxy billions of years older than humanity should be less likely to look unclaimed.
    epistemics:
      status: tentative
      belief:
        type: qualitative
        value: Plausible
      confidence: low

  - id: rare-life
    type: hypothesis
    title: Life or technological intelligence is rare
    body: One or more transitions from suitable planet to technological intelligence may be extraordinarily improbable.
    epistemics:
      status: open
      confidence: low
      cruxes:
        - Independent evidence of life or intelligence arising elsewhere.
    sources:
      - title: Rare Earth hypothesis
        url: https://en.wikipedia.org/wiki/Rare_Earth_hypothesis

  - id: short-lived-civilizations
    type: hypothesis
    title: Technological civilizations are short-lived
    body: Civilizations may repeatedly collapse or become extinct before establishing a durable interstellar presence.
    epistemics:
      status: open
      confidence: low
      cruxes:
        - Whether technological civilizations can pass through their most dangerous period and remain capable for geological timescales.
    sources:
      - title: Great Filter
        url: https://en.wikipedia.org/wiki/Great_Filter

  - id: civilizations-stay-small
    type: hypothesis
    title: Advanced civilizations remain inconspicuous
    body: Expansion may be infeasible or unattractive, while mature technology may become compact, efficient, and difficult to distinguish from nature.
    epistemics:
      status: open
      confidence: low
      cruxes:
        - Whether all but a negligible fraction of advanced civilizations avoid persistent expansion and large engineering.

  - id: evidence-is-hidden
    type: hypothesis
    title: Evidence exists but we cannot recognize it
    body: Extraterrestrial technology may be too distant, old, small, unfamiliar, or deliberately concealed for present searches to identify.
    epistemics:
      status: open
      confidence: low
    sources:
      - title: Zoo hypothesis
        url: https://en.wikipedia.org/wiki/Zoo_hypothesis

  - id: ambiguity-constrains-stories
    type: conclusion
    title: The ambiguity constrains combinations, not individual answers
    body: The empty sky does not establish any single solution. It does mean we cannot confidently accept every optimistic premise at once and remain unsurprised by the absence of anyone obvious.
    epistemics:
      status: accepted
      belief:
        type: qualitative
        value: Strong
      confidence: medium
      cruxes:
        - Better constraints on any one Drake-equation term could substantially shift which explanation carries the most weight.

edges:
  - id: local-supports-ambiguity
    from: no-local-trace
    to: observed-ambiguity
    type: supports

  - id: remote-supports-ambiguity
    from: no-remote-megastructure
    to: observed-ambiguity
    type: supports

  - id: ambiguity-explains-question
    from: observed-ambiguity
    to: central-question
    type: explains

  - id: one-lineage-assumes-expansion
    from: one-lineage-is-enough
    to: expansion-is-feasible
    type: assumes

  - id: lineage-supports-surprise
    from: one-lineage-is-enough
    to: absence-is-surprising
    type: supports

  - id: premises-support-surprise
    from: optimistic-premises
    to: absence-is-surprising
    type: supports

  - id: ambiguity-supports-surprise
    from: observed-ambiguity
    to: absence-is-surprising
    type: supports

  - id: limited-search-attacks-surprise
    from: searches-are-limited
    to: absence-is-surprising
    type: attacks
    note: Limited searches weaken the inference from no detection to genuine cosmic absence.

  - id: rare-life-explains-ambiguity
    from: rare-life
    to: observed-ambiguity
    type: explains

  - id: short-lives-explain-ambiguity
    from: short-lived-civilizations
    to: observed-ambiguity
    type: explains

  - id: small-civilizations-explain-ambiguity
    from: civilizations-stay-small
    to: observed-ambiguity
    type: explains

  - id: hidden-evidence-explains-ambiguity
    from: evidence-is-hidden
    to: observed-ambiguity
    type: explains

  - id: rare-life-alternative-to-hidden-evidence
    from: rare-life
    to: evidence-is-hidden
    type: alternative-to
    note: These emphasize different explanations but are not mutually exclusive.

  - id: lineage-attacks-universal-restraint
    from: one-lineage-is-enough
    to: civilizations-stay-small
    type: attacks
    note: A single durable exception would weaken universal non-expansion as an explanation.

  - id: hidden-evidence-attacks-surprise
    from: evidence-is-hidden
    to: absence-is-surprising
    type: attacks

  - id: surprise-supports-constraint
    from: absence-is-surprising
    to: ambiguity-constrains-stories
    type: supports

  - id: conclusion-depends-on-observation
    from: ambiguity-constrains-stories
    to: observed-ambiguity
    type: depends-on

  - id: conclusion-depends-on-premises
    from: ambiguity-constrains-stories
    to: optimistic-premises
    type: depends-on
