# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: Cyberpunk Church
description: Questions about intelligence, civilization, and reality.
url: "https://cyberpunk.church"
google_analytics: G-3QR2M1PYHS
include: []

# Homepage feature and social-card copy. Change `featured` when a post should
# replace the argument map as the site's primary invitation.
featured:
  text: Where is Everybody? →
  url: /where-is-everybody/
social_card:
  tagline: passing obsessions, taken slightly too seriously.
  prompt: follow the rabbit hole_

# jekyll-seo-tag reads its fallback image from front-matter defaults.
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /cyberpunk-church-og.png
        width: 1200
        height: 627

# Build settings
markdown: kramdown
permalink: /:title/
exclude:
  - lib
  - node_modules
  - package-lock.json
  - package.json
  - scripts
  - test
  - vendor

theme: jekyll-theme-hacker
show_downloads: false
